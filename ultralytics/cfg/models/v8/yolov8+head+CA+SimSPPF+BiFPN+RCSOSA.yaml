# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8 object detection model with P3-P5 outputs. For Usage examples see https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024] # YOLOv8n summary: 225 layers,  3157200 parameters,  3157184 gradients,   8.9 GFLOPs
  s: [0.33, 0.50, 1024] # YOLOv8s summary: 225 layers, 11166560 parameters, 11166544 gradients,  28.8 GFLOPs
  m: [0.67, 0.75, 768] # YOLOv8m summary: 295 layers, 25902640 parameters, 25902624 gradients,  79.3 GFLOPs
  l: [1.00, 1.00, 512] # YOLOv8l summary: 365 layers, 43691520 parameters, 43691504 gradients, 165.7 GFLOPs
  x: [1.00, 1.25, 512] # YOLOv8x summary: 365 layers, 68229648 parameters, 68229632 gradients, 258.5 GFLOPs

# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2     320
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4    160
  - [-1, 3, RCSOSA, [128]]              #160
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8    80
  - [-1, 6, RCSOSA, [256]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16  40
  - [-1, 6, RCSOSA, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32  20
  - [-1, 3, RCSOSA, [1024, True]]
  - [-1, 1, CA, [1024]]
  - [-1, 1, SimSPPF, [1024, 5]] # 10          20

# YOLOv8.0n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   #11   40
  - [[-1, 6], 1, BiFPN_Concat2, [1]]  # cat backbone P4
  - [-1, 3, RCSOSA, [512]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  #80   14
  - [[-1, 4], 1, BiFPN_Concat2, [1]]  # cat backbone P3   15
  - [-1, 3, RCSOSA, [256]]        #16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  #160
  - [[-1, 2], 1, BiFPN_Concat2, [1]] # cat backbone P3
  - [-1, 3, RCSOSA, [128]] # 19   (P3/4-Ssmall)

  - [-1, 1, Conv, [128,3, 2]]   # 80
  - [[-1, 16], 1, BiFPN_Concat2, [1]] # cat head P4
  - [-1, 3, RCSOSA, [256]] # 22 (P4/16-small)

  - [-1, 1, Conv, [256, 3, 2]] # 40
  - [[-1, 6, 13], 1, BiFPN_Concat3, [1]] # cat head P4
  - [-1, 3, RCSOSA, [512]] # 25 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 20
  - [[-1, 10], 1, BiFPN_Concat2, [1]] # cat head P5
  - [-1, 3, RCSOSA, [1024]] # 28 (P5/32-large)

  - [[19, 22, 25, 28], 1, Detect, [nc]] # Detect(P3, P4, P5)
